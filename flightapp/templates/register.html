{% extends 'layout/base.html' %}
{% from 'layout/macros.html' import error_list %}

{% block title %}Đăng ký{% endblock %}

{% block content %}
<h1 class="text-center text-success mt-2">ĐĂNG KÝ NGƯỜI DÙNG</h1>

{{ error_list(errors) }}

<form method="post" action="/register">
    <div class="form-floating mb-3 mt-3">
      <input type="text" class="form-control" id="name" placeholder="Họ tên" name="name" value="{{ form.get('name', '') if form }}" required />
      <label for="name">Họ tên</label>
    </div>
    <div class="form-floating mb-3 mt-3">
      <input type="text" class="form-control" id="username" placeholder="Tên đăng nhập" name="username" value="{{ form.get('username', '') if form }}" required />
      <label for="username">Tên đăng nhập</label>
    </div>
    <div class="form-floating mb-3 mt-3">
      <input type="password" class="form-control" id="password" placeholder="Mật khẩu" name="password" required />
      <label for="password">Mật khẩu</label>
    </div>
    <div class="form-floating mb-3 mt-3">
      <input type="password" class="form-control" id="confirm" placeholder="Xác nhận mật khẩu" name="confirm" required />
      <label for="confirm">Xác nhận mật khẩu</label>
    </div>
    <div class="form-floating mb-3 mt-3">
        <button class="btn btn-success" type="submit">Đăng ký</button>
    </div>
</form>
{% endblock %}
